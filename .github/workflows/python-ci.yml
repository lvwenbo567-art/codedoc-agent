name: Python CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      LANGCHAIN_CHAT_PROVIDER: mock
      EMBEDDING_PROVIDER: mock
      RERANK_PROVIDER: mock
      LANGGRAPH_CHECKPOINT_DB: data/ci_checkpoints.sqlite

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov

      - name: Import smoke test
        run: |
          python -c "import sys; sys.path.append('app'); import api_main; print('import ok')"

      - name: Run unit and integration tests
        run: |
          mkdir -p outputs
          python -m pytest \
            -m "not real_model" \
            --maxfail=1 \
            --disable-warnings \
            --junitxml=outputs/test-results.xml \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:outputs/coverage.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: |
            outputs/test-results.xml
            outputs/coverage.xml
