[pytest]
addopts = --basetemp=.pytest-tmp
testpaths = tests
asyncio_mode = auto
markers =
    unit: pure unit tests
    integration: integration tests
    graph: LangGraph path tests
    persistence: checkpoint and recovery tests
    hitl: interrupt and resume tests
    sse: streaming contract tests
    real_model: requires a real external model
    slow: slow-running tests
